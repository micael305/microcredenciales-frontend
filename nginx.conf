server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Detección de bots de redes sociales (LinkedIn, WhatsApp, X, Telegram, etc)
    set $is_bot 0;
    if ($http_user_agent ~* "facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|discordbot") {
        set $is_bot 1;
    }

    # Interceptar la ruta /verificar/{hash}
    location ~ ^/verificar/(.*)$ {
        if ($is_bot = 1) {
            # Redirigir a los bots al backend que renderiza las etiquetas Open Graph
            return 302 https://api-credenciales.utnpf.site/api/public/verify/$1/embed;
        }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}
